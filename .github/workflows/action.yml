name: build-on-push
on: push

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: pull-code
        uses: actions/checkout@v7
      
      - name: Enable corepack
        run: corepack enable

      - name: install-nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: run tests
        run: yarn test

      - name: build project
        run: yarn run build
